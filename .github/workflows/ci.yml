name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run transaction, reserve, capacity, and cargo tests
        run: dotnet test tests/WingCommand.PureTests/WingCommand.PureTests.csproj --configuration Release
